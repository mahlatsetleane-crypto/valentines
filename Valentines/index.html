<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Floating Hearts Container */
    .hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: #ef233c;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Card & Envelope Styling */
    .envelope, #card {
      position: relative;
      z-index: 10;
    }

    .envelope {
      background: #fff;
      border: 3px solid #ef233c;
      padding: 40px;
      width: 280px;
      cursor: pointer;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .envelope:hover { transform: scale(1.05); }

    .hidden { display: none !important; }

    #card {
      background: #edf2f4;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
      max-width: 350px;
      border: 2px solid #ef233c;
    }

    h2 { 
      font-family: 'Dancing Script', cursive;
      color: #d90429;
      font-size: 2.8rem;
      margin-top: 0;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .yes {
      background: #d90429;
      color: white;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .maybe {
      background: #8d99ae;
      color: white;
      position: absolute;
      transition: all 0.12s ease-out;
      z-index: 20;
    }

    .polaroid-frame {
      background: white;
      padding: 12px 12px 35px 12px;
      border: 1px solid #ddd;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transform: rotate(2deg);
      margin-top: 20px;
      display: inline-block;
    }

    img { max-width: 250px; display: block; border-radius: 2px; }

    .caption {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: #2b2d42;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="hearts-container" id="hearts"></div>

  <div class="envelope" id="envelope" onclick="openEnvelope()">
    <span style="font-size: 60px;">💌</span> <br><br>
    <strong style="color: #2b2d42;">For Mr Danca</strong><br>
    <small style="color: #ef233c;">Click to reveal</small>
  </div>

  <div class="hidden" id="card">
    <h2>Mr Danca 💕</h2>
    <p>Will you be my Valentine?</p>
    <button class="yes" onclick="yes()">Of course! 😍</button>
    <button class="maybe" id="maybe">Perhaps 🤔</button>
    <div class="hidden" id="gang">
      <h2>GANG GANG 💃🏽🔥</h2>
      <div class="polaroid-frame">
        <img src="IMG_1584.jpeg" alt="Us ❤️">
        <div class="caption">My favorite person.</div>
      </div>
    </div>
  </div>

  <script>
    // Create floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 3 + "s";
      heart.style.fontSize = Math.random() * 20 + 10 + "px";
      document.getElementById("hearts").appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 300);

    function openEnvelope() {
      document.getElementById("envelope").classList.add("hidden");
      document.getElementById("card").classList.remove("hidden");
      moveButton();
    }

    const maybeBtn = document.getElementById("maybe");
    function moveButton() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      maybeBtn.style.left = x + "px";
      maybeBtn.style.top = y + "px";
    }

    maybeBtn.addEventListener("mouseover", moveButton);
    maybeBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveButton(); });

    function yes() {
      document.getElementById("maybe").style.display = "none";
      document.getElementById("gang").classList.remove("hidden");
      // Triple the hearts when they say yes!
      for(let i=0; i<20; i++) setTimeout(createHeart, i*100);
    }
  </script>
</body>
</html>

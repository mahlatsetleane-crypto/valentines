<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- WhatsApp Preview -->
  <meta property="og:title" content="A message just for you 💌">
  <meta property="og:description" content="Mr Danca… open this 😌">
  <meta property="og:image" content="https://images.unsplash.com/photo-1517841905240-472988babdf9">
  <meta property="og:type" content="website">

  <title>My Valentine 💘</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #b11226, #e63946);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .envelope {
      background: #fff;
      border: 2px solid #e63946;
      padding: 40px;
      width: 320px;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      animation: float 2s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .hidden {
      display: none;
    }

    .buttons {
      position: relative;
      height: 160px;
      margin-top: 20px;
    }

    button {
      padding: 12px 24px;
      margin: 12px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    .yes {
      background: #e63946;
      color: white;
    }

    .maybe {
      background: #ccc;
      position: absolute;
    }

    img {
      max-width: 260px;
      border-radius: 18px;
      margin-top: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }

    .final {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #e63946;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.35);
      animation: floatUp 8s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 0;
      }
      10% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Envelope -->
  <div class="envelope" id="envelope" onclick="openEnvelope()">
    💌 <br><br>
    <strong>Open here</strong>
  </div>

  <!-- Valentine Card -->
  <div class="hidden" id="card">
    <h2>Mr Danca 💕</h2>
    <p><strong>Will you be my Valentine?</strong></p>

    <div class="buttons">
      <button class="yes" onclick="yes()">Of course! 😍</button>
      <button class="maybe" id="maybe">Perhaps 🤔</button>
    </div>

    <p id="response"></p>

    <div class="hidden" id="gang">
      <h2>GANG GANG 💃🏽🔥</h2>
      <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" alt="Us ❤️">
      <div class="final">
        Dinner is on me…<br>
        and dessert is you 😌🍷
      </div>
    </div>
  </div>

  <!-- Music -->
  <audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

  <script>
    // Hearts everywhere
    function createHearts() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = 14 + Math.random() * 22 + "px";
        heart.style.animationDuration = 5 + Math.random() * 5 + "s";
        heart.style.animationDelay = Math.random() * 5 + "s";
        document.body.appendChild(heart);
      }
    }

    createHearts();

    function openEnvelope() {
      document.getElementById("envelope").classList.add("hidden");
      document.getElementById("card").classList.remove("hidden");

      const music = document.getElementById("music");
      music.volume = 0.6;
      music.currentTime = 0;
      music.play().catch(() => {});

      const maybe = document.getElementById("maybe");
      maybe.style.top = "60px";
      maybe.style.left = "140px";
    }

    const maybeBtn = document.getElementById("maybe");
    maybeBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 220;
      const y = Math.random() * 120;
      maybeBtn.style.left = x + "px";
      maybeBtn.style.top = y + "px";
    });

    function yes() {
      document.getElementById("response").innerText =
        "You always make the right choice 😌❤️";
      document.getElementById("gang").classList.remove("hidden");
    }
  </script>

</body>
</html>
